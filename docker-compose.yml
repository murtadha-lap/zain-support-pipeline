# Three layers: PostgreSQL ← FastAPI backend ← Next.js frontend.
# vLLM (local model) is optional: `docker compose --profile gpu up` on a machine with an NVIDIA GPU.
# See docs/vllm.md for serving the models outside Docker.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zsp
      POSTGRES_PASSWORD: zsp
      POSTGRES_DB: zsp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zsp -d zsp"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://zsp:zsp@db:5432/zsp
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      FRONTEND_ORIGIN: http://localhost:3000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    # Seed is idempotent: teams, routing, models, settings and demo users.
    command: sh -c "python -m app.seed --demo && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./data:/app/data:ro   # demo seed reads data/train.jsonl
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

  vllm:
    profiles: ["gpu"]
    image: vllm/vllm-openai:v0.11.0
    # Base model + the fine-tuned LoRA adapter, both served on one port.
    # Each --lora-modules name becomes a model id you register in Admin → Models.
    command: >
      --model Qwen/Qwen3.5-4B
      --enable-lora
      --lora-modules zain-triage-lora=/adapters/zain-triage-lora
      --max-model-len 4096
      --max-logprobs 20
      --port 8001
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ./adapters:/adapters:ro
      - hf-cache:/root/.cache/huggingface
    ports:
      - "8001:8001"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  pgdata:
  hf-cache:
